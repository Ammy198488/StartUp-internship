<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Register | Capzul</title>
</head>

<body>
  <div class="container">
    <div class="left_side">
      <h5>Social media shared today, tomorrow or by location</h5>
      <img src="/images/Imgs (1).png" alt="left_image">
    </div>
    <div class="right_side">
      <div class="logo">
        <img src="/images/Logo (1).png" alt="logo">
      </div>
      <div class="form_head">
        <h2>Create account</h2>
        <p>For business, band or celebrity.</p>
      </div>
      <form action="submit">
        <form action="submit">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email">Email or Phone Number</label>
              <input type="email" id="email" required>
            </div>
            <div class="form-group">
              <label for="dob">Date of Birth <small>(MM/DD/YY)</small></label>
              <input type="date" id="dob" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" required>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <input type="password" id="confirmPassword" required>
            </div>
          </div>

          <div class="form-group checkbox-group">
            <div>
              <input type="checkbox" id="rememberMe">
              <label for="rememberMe">Remember me</label>
            </div>
            <div>
              <input type="checkbox" id="agreeTerms" required>
              <label for="agreeTerms">I agree to all the <a href="#">Terms and Privacy policy</a></label>
            </div>
          </div>
          <div class="btn_grp">
            <button class="btn blue-btn">Create account</button>
            <button class="btn black-btn"> <img src="./images/iconfinder_Google_1298745 1.png" />Sign-in with
              Google</button>
          </div>
        </form>
        <p class="log_in">Don't have an account? <a href="">Log in</a></p>
        <div class="app_store">
          <img src="./images/Group1.png" />
          <img src="./images/Google Play Badge.png" />
        </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>

</html>
